name:                testing-hs
version:             0.1.0.0
license:             BSD-3-Clause

extra-source-files:
- README.md
- CHANGELOG.md

dependencies:
- base >= 4.7 && < 5

ghc-options:
- -Wall

library:
  source-dirs: src
  dependencies:
  - containers
  - mtl

executables:
  testing-hs-exe:
    main: Main.hs
    source-dirs: app
    dependencies:
    - testing-hs
    - containers
    - mtl

tests:
  testing-hs-test:
    main: Spec.hs
    source-dirs: test
    dependencies:
    - testing-hs
    - HUnit
    - QuickCheck
